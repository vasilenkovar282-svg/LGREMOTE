name: Build iOS IPA
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned app
        run: |
          xcodebuild -project LGRemote.xcodeproj -target LGRemote -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CONFIGURATION_BUILD_DIR="$PWD/build" build
          mkdir -p Payload
          cp -R build/LGRemote.app Payload/
          zip -qr LGRemote.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LGRemote-IPA
          path: LGRemote.ipa
